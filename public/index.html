<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Buddy Notifications</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f8fafc; text-align: center; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 360px; width: 100%; }
    h2 { margin-top: 0; color: #1e293b; font-size: 22px; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; }
    button { background: #4F46E5; color: white; border: none; padding: 14px 24px; border-radius: 10px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 15px; }
    button:active { background: #4338CA; }
    .guide { text-align: left; background: #EEF2FF; padding: 16px; border-radius: 12px; font-size: 13px; line-height: 1.6; color: #3730A3; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <h2>🔔 Push Notifications</h2>
    <p id="desc">Stay updated on daily matches and new messages in real time.</p>
    <div id="content"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://jzpmvojogqouwjwmxtmz.supabase.co";
    const SUPABASE_ANON_KEY = `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6cG12b2pvZ3FvdXdqd214dG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTI3MDIsImV4cCI6MjEwNjQyODcwMn0.DFJdFqrVW7vGkdrCUZplpUsYwNuvmlaGN1yoP4HSUr0`;
    const VAPID_PUBLIC_KEY = "BOkquNCkgqXUwWojEDf8uUDKA7MbQtas5BytvOHi5QFnpcvWPZhM0ZdlJ9cMt8Rk6UcS1rFLJypffHcmZZzPzcM";

    const urlParams = new URLSearchParams(window.location.search);
    const paramUserId = urlParams.get('user_id');

    // 1. URL에 user_id가 있으면 브라우저에 즉시 저장
    if (paramUserId) {
      localStorage.setItem('daily_buddy_user_id', paramUserId.trim());
    }

    // 2. URL 파라미터가 날아가도 로컬스토리지에서 복구
    const userId = paramUserId || localStorage.getItem('daily_buddy_user_id');

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

    const contentDiv = document.getElementById('content');

    if (isIOS && !isStandalone) {
      // 아이폰 사파리에서 열었을 때 안내
      contentDiv.innerHTML = `
        <div class="guide">
          <b>📱 iPhone 2단계 설정 안내:</b><br><br>
          <b>[1단계]</b> 하단 공유 버튼(네모 속 화살표 ↑)을 누르고 <b>[홈 화면에 추가]</b>를 누르세요.<br><br>
          <b>[2단계]</b> 홈 화면에 생긴 <b>Daily Buddy 아이콘</b>을 눌러 다시 열고 알림 허용을 완료하세요!
        </div>
      `;
    } else {
      // 안드로이드 또는 아이폰 PWA(홈 화면 아이콘)로 열었을 때
      contentDiv.innerHTML = `<button id="btn-allow">Enable Notifications</button>`;
      document.getElementById('btn-allow').addEventListener('click', setupPush);
    }

    async function setupPush() {
      if (!userId) {
        alert("User session not found. Please open this page from the Daily Buddy app.");
        return;
      }
      try {
        const reg = await navigator.serviceWorker.register('/sw.js');
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          contentDiv.innerHTML = `
            <div class="guide" style="background: #FEF2F2; color: #991B1B; border: 1px solid #FCA5A5;">
              <b>⚠️ Notification Permission Blocked</b><br><br>
              브라우저 설정에서 알림 권한을 '허용'으로 변경한 후 페이지를 새로고침해 주세요.
            </div>
            <button onclick="location.reload()" style="background: #DC2626; margin-top: 15px;">Reload Page</button>
          `;
          return;
        }

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        // Supabase users 테이블에 push_token 저장
        const cleanId = (userId || '').trim();
        const filter = cleanId.includes('@') 
          ? `email=eq.${encodeURIComponent(cleanId.toLowerCase())}` 
          : `id=eq.${cleanId}`;

        const res = await fetch(`${SUPABASE_URL}/rest/v1/users?${filter}`, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
         body: JSON.stringify({ 
  push_token: sub,
  is_push_enabled: true 
})
        });

        if (res.ok) {
          document.getElementById('app').innerHTML = `
            <h3>✅ All Set!</h3>
            <p>Notifications are now enabled.<br>You can close this tab and return to Daily Buddy.</p>
          `;
        } else {
          throw new Error("Failed to save notification token.");
        }
      } catch (err) {
        alert("Failed to enable notifications: " + err.message);
      }
    }

    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }
  </script>
</body>
</html>
